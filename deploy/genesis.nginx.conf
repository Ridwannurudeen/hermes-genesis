server {
    server_name hermesgenesis.world;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=(), midi=(), interest-cohort=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip — site-level. Compresses proxied JS/CSS/JSON/SVG/HTML responses
    # from the FastAPI static handler. /api/ overrides this with `gzip off`
    # so SSE streams flush events in real time without a buffer window.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/ttf
        font/otf
        application/font-woff
        application/font-woff2
        application/vnd.ms-fontobject;

    location /api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;

        # SSE-friendly: nginx was buffering streamed events, so the browser
        # got nothing until the buffer flushed. World generation takes
        # ~60-180s, all of which appeared as a blank wait. These directives
        # let progress events hit the browser as soon as the backend emits.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        gzip off;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Bundles + media — content-hashed by Vite so safe to cache aggressively.
    # FastAPI already sets `cache-control: public, max-age=31536000, immutable`
    # for these; we only need to proxy them through.
    location /assets/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback — every non-/api/, non-/assets/ path returns the same
    # index.html (React Router resolves the route client-side). The HTML is
    # the entry point that pulls in the latest content-hashed bundles, so it
    # MUST never be cached. Without no-store here, browsers serve yesterday's
    # index.html that references deleted bundle filenames, and the user sees
    # stale UI even after hard-refreshing on routes like /world/<id>?cinematic=1.
    #
    # The earlier version of this block only matched the exact `/`, `/index.html`,
    # and `/manifest.json` — which meant SPA URLs (/watch, /chronicle/<slug>,
    # /world/<id>?cinematic=1) went through the catch-all without the no-store
    # header and got cached. Found by user May 2 2026 ("all the changes and
    # fixes are not reflecting on the site").
    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        # add_header doesn't inherit when any add_header is specified inside
        # a location block, so re-assert the security headers here.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/hermesgenesis.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hermesgenesis.world/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = hermesgenesis.world) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name hermesgenesis.world;
    return 404;
}
