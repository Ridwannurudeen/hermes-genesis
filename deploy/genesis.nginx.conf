server {
    server_name hermesgenesis.world;

    # Security headers (P2-2 audit fix)
    # HSTS: opt this domain into HTTPS for 1 year, including all subdomains, eligible for browser preload list.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # CSP: same-origin scripts/connects/media; Google Fonts allowed; no third-party JS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
    # Permissions-Policy: deny sensitive features the app doesn't use.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=(), midi=(), interest-cohort=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;

        # SSE-friendly. Without these, nginx buffers streamed events and
        # the browser sees nothing for ~30+ seconds during world generation
        # / regen / control-room streams. Symptom: long blank wait, then
        # the page eventually unblocks (or the connection drops). Worth
        # keeping these on for /api/ — every endpoint here is either fast
        # (no benefit from buffering) or streamed (must not buffer).
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        gzip off;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hermesgenesis.world/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hermesgenesis.world/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = hermesgenesis.world) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name hermesgenesis.world;
    return 404; # managed by Certbot


}
