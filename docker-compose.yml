version: '3.8'

services:
  genesis:
    build: .
    container_name: genesis-api
    ports:
      - "8003:8003"
    volumes:
      - /opt/genesis/data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
